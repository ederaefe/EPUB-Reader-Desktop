name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_docker:
        description: 'Push Docker image to GHCR on manual run'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            package_cmd: npm run package:win
          - os: macos-latest
            label: macOS
            package_cmd: npm run package:mac
          - os: ubuntu-latest
            label: Linux
            package_cmd: npm run package:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux RPM packaging dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build application bundle
        run: npm run build

      - name: Prepare Apple notarization API key (if configured)
        if: runner.os == 'macOS' && secrets.APPLE_API_KEY != ''
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: Package Windows installers (.exe setup & portable)
        if: runner.os == 'Windows'
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT_NAME: ${{ secrets.AZURE_SIGN_ACCOUNT_NAME }}
          AZURE_SIGN_PROFILE_NAME: ${{ secrets.AZURE_SIGN_PROFILE_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Package macOS images (arm64 & x64 .dmg / .zip)
        if: runner.os == 'macOS'
        run: npm run package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Package Linux images (.AppImage, .deb, .rpm)
        if: runner.os == 'Linux'
        run: npm run package:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify MuPDF WASM unpacked cleanly
        shell: bash
        run: |
          WASM_COUNT=$(find release -path "*app.asar.unpacked*mupdf*.wasm" 2>/dev/null | wc -l)
          echo "Found unpacked MuPDF WASM files: ${WASM_COUNT}"
          if [ "$WASM_COUNT" -lt 1 ]; then
            echo "ERROR: mupdf-wasm.wasm was not unpacked into app.asar.unpacked!"
            exit 1
          fi

      - name: Upload distributable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest*.yml

  docker:
    name: Build & Publish Container (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_docker == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ederaefe/semply-ebook-reader
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker container
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_docker == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Docker container build provenance
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_docker == true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/ederaefe/semply-ebook-reader
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish GitHub Release & Checksums
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all OS release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: Generate SHA256SUMS.txt
        working-directory: dist-release
        run: |
          shopt -s nullglob
          FILES=(*.exe *.dmg *.zip *.AppImage *.deb *.rpm)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release binaries found!"
            exit 1
          fi
          sha256sum "${FILES[@]}" | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate SLSA Build Provenance Attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.rpm
            dist-release/SHA256SUMS.txt

      - name: Compose release notes
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat <<EOF > release-notes.md
          ## Semply Ebook Reader ${TAG}

          Official cross-platform desktop and containerized release of **Semply Ebook Reader** — a fast, local-first EPUB and PDF reader with offline MuPDF WASM reflow, dual-mode auto-scroll, 77 curated fonts, drift-proof annotations, and 4 contrast-preserving themes.

          ### Desktop Installers & Portable Images
          - **Windows (x64):** \`Semply-Ebook-Reader-*-win-x64-setup.exe\` (Installer) or \`*-win-x64-portable.exe\` (Portable)
          - **macOS (Apple Silicon M1–M4):** \`Semply-Ebook-Reader-*-mac-arm64.dmg\` (or \`.zip\`)
          - **macOS (Intel x64):** \`Semply-Ebook-Reader-*-mac-x64.dmg\` (or \`.zip\`)
          - **Linux (x64):** \`.AppImage\` (Universal), \`.deb\` (Debian / Ubuntu), \`.rpm\` (Fedora / RHEL)

          ### Self-Hosted Docker Container (Browser-Streamed)
          \`\`\`bash
          docker run -d \\
            --name semply-ebook-reader \\
            --shm-size=1gb \\
            -p 3001:3001 \\
            -v ./semply-config:/config \\
            -v ./books:/books \\
            ghcr.io/ederaefe/semply-ebook-reader:${TAG#v}
          \`\`\`
          Then open \`https://localhost:3001\` in your browser.

          ### Verify Binary Integrity & Build Provenance
          Every binary in this release is compiled directly on GitHub Actions from public source code and cryptographically attested with SLSA Build Provenance.

          - **Verify SHA-256 checksum (Windows PowerShell):**
            \`Get-FileHash .\Semply-Ebook-Reader-*-win-x64-setup.exe -Algorithm SHA256\`
          - **Verify SHA-256 checksum (macOS / Linux):**
            \`sha256sum -c SHA256SUMS.txt --ignore-missing\`
          - **Verify GitHub SLSA Build Provenance:**
            \`gh attestation verify <downloaded-file> --owner ederaefe\`
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Semply Ebook Reader ${{ github.ref_name }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
