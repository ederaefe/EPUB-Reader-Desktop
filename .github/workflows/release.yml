name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            package_cmd: npm run package:win
          - os: macos-latest
            label: macOS
            package_cmd: npm run package:mac
          - os: ubuntu-latest
            label: Linux
            package_cmd: npm run package:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux RPM packaging dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm rpm-build build-essential

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build application bundle
        run: npm run build

      - name: Package Windows installers (.exe setup & portable)
        if: runner.os == 'Windows'
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package macOS images (arm64 & x64 .dmg / .zip)
        if: runner.os == 'macOS'
        run: npm run package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Linux images (.AppImage, .deb, .rpm)
        if: runner.os == 'Linux'
        run: npm run package:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify MuPDF WASM unpacked cleanly
        shell: bash
        run: |
          WASM_COUNT=$(find release -path "*app.asar.unpacked*" -name "*.wasm" 2>/dev/null | wc -l)
          echo "Found unpacked WASM files: ${WASM_COUNT}"
          if [ "$WASM_COUNT" -lt 1 ]; then
            echo "ERROR: No .wasm files were unpacked into app.asar.unpacked!"
            echo "Contents of release/:"
            find release -maxdepth 4 -type f | sort || true
            exit 1
          fi

      - name: Upload distributable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest*.yml


  publish:
    name: Publish GitHub Release & Checksums
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download all OS release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: Generate SHA256SUMS.txt
        working-directory: dist-release
        run: |
          shopt -s nullglob
          FILES=(*.exe *.dmg *.zip *.AppImage *.deb *.rpm)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release binaries found!"
            exit 1
          fi
          sha256sum "${FILES[@]}" | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat <<EOF > release-notes.md
          ## Semply Ebook Reader ${TAG}

          Official cross-platform desktop and containerized release of **Semply Ebook Reader** — a fast, local-first EPUB and PDF reader with offline MuPDF WASM reflow, dual-mode auto-scroll, 77 curated fonts, drift-proof annotations, and 4 contrast-preserving themes.

          ### Desktop Installers & Portable Images
          - **Windows (x64):** \`Semply-Ebook-Reader-*-win-x64-setup.exe\` (Installer) or \`*-win-x64-portable.exe\` (Portable)
          - **macOS (Apple Silicon M1–M4):** \`Semply-Ebook-Reader-*-mac-arm64.dmg\` (or \`.zip\`)
          - **macOS (Intel x64):** \`Semply-Ebook-Reader-*-mac-x64.dmg\` (or \`.zip\`)
          - **Linux (x64):** \`.AppImage\` (Universal), \`.deb\` (Debian / Ubuntu), \`.rpm\` (Fedora / RHEL)

          ### Self-Hosted Docker Container (Browser-Streamed)
          \`\`\`bash
          docker run -d \\
            --name semply-ebook-reader \\
            --shm-size=1gb \\
            -p 3001:3001 \\
            -v ./semply-config:/config \\
            -v ./books:/books \\
            ghcr.io/ederaefe/semply-ebook-reader:${TAG#v}
          \`\`\`
          Then open \`https://localhost:3001\` in your browser.

          ### Verify Binary Integrity & Build Provenance
          Every binary in this release is compiled directly on GitHub Actions from public source code and cryptographically attested with SLSA Build Provenance.

          - **Verify SHA-256 checksum (Windows PowerShell):**
            \`Get-FileHash .\Semply-Ebook-Reader-*-win-x64-setup.exe -Algorithm SHA256\`
          - **Verify SHA-256 checksum (macOS / Linux):**
            \`sha256sum -c SHA256SUMS.txt --ignore-missing\`
          - **Verify GitHub SLSA Build Provenance:**
            \`gh attestation verify <downloaded-file> --owner ederaefe\`
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Semply Ebook Reader ${{ github.ref_name }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
